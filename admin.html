<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Researcher dashboard</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header>
  <h1>Researcher dashboard</h1>
  <div id="status" class="status"></div>
</header>

<section id="login" class="panel narrow">
  <p>Enter the admin passphrase you set in the Apps Script project.</p>
  <input id="pass" type="password" placeholder="Admin passphrase" autocomplete="current-password">
  <button id="login-btn" class="primary">Sign in</button>
  <p id="login-error" class="error"></p>
</section>

<div id="app" class="hidden">
  <nav id="tabs">
    <button data-tab="participants" class="active">Participants</button>
    <button data-tab="feed">Feed</button>
    <button data-tab="users">Fake users</button>
    <button data-tab="text">Text &amp; settings</button>
    <button data-tab="data">Data</button>
    <button data-tab="preview">Preview</button>
    <button id="logout" class="link">Sign out</button>
  </nav>
  <section id="tab-participants" class="panel"></section>
  <section id="tab-feed" class="panel hidden"></section>
  <section id="tab-users" class="panel hidden"></section>
  <section id="tab-text" class="panel hidden"></section>
  <section id="tab-data" class="panel hidden"></section>
  <section id="tab-preview" class="panel hidden"></section>
</div>

<div id="modal-root"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="admin.js"></script>
</body>
</html>
